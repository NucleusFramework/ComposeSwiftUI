name: Publish Gradle plugin to the Plugin Portal

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: macos-15
    env:
      GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
      GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish on Plugin Portal
        run: ./gradlew :gradle-plugin:setupPluginUploadFromEnvironment :gradle-plugin:publishPlugins --no-configuration-cache
