name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish again (e.g. v0.7.1)
        required: true

permissions:
  contents: read
  id-token: write  # provenance attestations
  attestations: write

jobs:
  publish:
    # Apple targets can only be compiled on macOS. Intel, because hosted arm64 macOS runners can stay unavailable for hours.
    runs-on: macos-15-intel
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Cache Kotlin/Native
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Publish to Maven Central
        # The build reads the version from GITHUB_REF, which is the branch on a manual run
        run: GITHUB_REF="refs/tags/${INPUT_TAG:-${GITHUB_REF#refs/tags/}}" ./gradlew :runtime:publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          INPUT_TAG: ${{ inputs.tag }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVENCENTRALUSERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVENCENTRALPASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNINGINMEMORYKEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNINGKEYID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNINGPASSWORD }}

      # The same files as on Maven Central, built by the same job
      - name: Collect the published artifacts
        run: GITHUB_REF="refs/tags/${INPUT_TAG:-${GITHUB_REF#refs/tags/}}" ./gradlew :runtime:publishToMavenLocal --no-configuration-cache
        env:
          INPUT_TAG: ${{ inputs.tag }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNINGINMEMORYKEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNINGKEYID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNINGPASSWORD }}

      - name: Provenance of the published artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ~/.m2/repository/dev/nucleusframework/compose-swiftui*/*/*.klib
            ~/.m2/repository/dev/nucleusframework/compose-swiftui*/*/*.jar
            ~/.m2/repository/dev/nucleusframework/compose-swiftui*/*/*.module
            ~/.m2/repository/dev/nucleusframework/compose-swiftui*/*/*.pom
