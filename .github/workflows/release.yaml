name: GitHub release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          {
            # This version's section of CHANGELOG.md, without its heading
            awk -v v="## $VERSION" '$0 == v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md
            echo ""
            echo "Install with the Gradle plugin in your shared KMP module:"
            echo ""
            echo '```kotlin'
            echo "plugins {"
            echo "    id(\"dev.nucleusframework.compose-swiftui\") version \"$VERSION\""
            echo "}"
            echo '```'
            echo ""
            echo "Library: \`dev.nucleusframework:compose-swiftui:$VERSION\` on Maven Central."
            echo "Gradle plugin: \`dev.nucleusframework.compose-swiftui\` $VERSION on the Gradle Plugin Portal."
          } > notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --generate-notes --verify-tag
