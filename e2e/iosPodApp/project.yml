# The e2e iOS app (sources of e2e/iosApp) through CocoaPods: the podspec `assembleComposeSwiftUIPackage` writes.
# Built and run by scripts/run_ios_package_e2e.sh --cocoapods.
name: E2EiOSPods
options:
  bundleIdPrefix: dev.nucleusframework.composeswiftui
  deploymentTarget:
    iOS: "17.0"
targets:
  E2EiOSPods:
    type: application
    platform: iOS
    sources: [../iosApp/Sources]
    info:
      path: ../iosApp/Sources/Info.plist
      properties:
        UILaunchScreen: {}
    settings:
      base:
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        # CocoaPods' own script phases need it; the Swift package integration doesn't (e2e/iosApp)
        ENABLE_USER_SCRIPT_SANDBOXING: NO
